# Builds a release when a version tag (v1.2.3) is pushed. Releases are only ever built here, never on a PC.
# Every file gets a SHA-256 checksum and a build provenance attestation, so anyone can verify that a
# download was built by this workflow from this repository at the tagged commit:
#   gh attestation verify CS2ModVerifier.exe --repo KDanielK/CS2ModVerifier
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write       # create the GitHub release
  id-token: write       # sign the provenance attestation
  attestations: write   # store the attestation

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      # Self-contained single file: nothing else to install. Not compressed, because compressed
      # bundles look packed to antivirus software. No debug symbols in the release.
      - name: Publish
        run: >
          dotnet publish src/CS2ModVerifier.App --configuration Release --runtime win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false
          -p:DebugType=none -p:Version=${{ steps.version.outputs.version }} --output publish

      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "CS2ModVerifier-${{ github.ref_name }}-win-x64"
          New-Item -ItemType Directory -Path dist, $name | Out-Null
          Copy-Item publish/CS2ModVerifier.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item publish/CS2ModVerifier.exe dist/
          # Unix line endings, so "sha256sum -c SHA256SUMS.txt" works on every platform.
          $sums = Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/CS2ModVerifier.exe
            dist/*.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "CS2 Mod Verifier ${{ github.ref_name }}" --notes-file $notes --verify-tag
